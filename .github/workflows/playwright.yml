name: Playwright tests
# Every push to every branch runs the suite (owner decision 2026-11-11, the same rule as qa-test-harness-template), so a
# branch is tested before it reaches main. pull_request stays for pull requests from forks, which push no branch here; a
# pull request from a branch in this repository therefore runs twice (once per event).
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
# A newer push to a pull request cancels that pull request's older run. Each push gets its own group (its commit SHA),
# so no pushed commit, on main or any branch, is ever cancelled or dropped as pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      # Actions pinned by commit (all three run on node24).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - name: Check the tests against broken copies of the app
        run: node scripts/mutants.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  # The browserless server tests on Windows and macOS: the server's non-Linux branch (realpath + dev/ino, scripts/
  # serve-demo.js) and the Windows swap test (EPERM) run only there. Labels are pinned images, like ubuntu-24.04 above.
  server-other-os:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the server tests (no browser needed)
        run: npx playwright test --project=server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-server-${{ matrix.os }}
          path: playwright-report/
          retention-days: 30
