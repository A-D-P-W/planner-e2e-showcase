# 2026-11-09 (owner decision, supply-chain review): OSV-Scanner on pull requests to main. It compares the lockfile's known
# vulnerabilities before and after the change and fails only on vulnerabilities the pull request introduces. The weekly
# Scorecard run already reports existing ones; this adds the gate before merge. Results go to Security > Code scanning.
# Reusable workflow pinned by commit (google/osv-scanner-action v2.7.0); it pins its own actions by commit too.
name: osv-scanner
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  osv-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36   # v2.7.0
    with:
      runs-on: ubuntu-24.04
